seed: 42
device: cpu

data:
  batch_size: 256
  num_workers: 2
  pin_memory: true
  normalize: true
  normalize_mean: 0.1307
  normalize_std: 0.3081

model:
  k: 490
  num_classes: 10

train:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0
  device: cpu
  n_train_samples: null

generators:
  n_samples: 60000
  batch_size: 128
  tau: 1.0e-8
  device: cpu
  normalize_mean: 0.1307
  normalize_std: 0.3081

transition:
  n_samples: 60000
  tau: 1.0e-8
  lambda_: 0.5
  lsqr_iter_lim: 200
  lsqr_atol: 1.0e-6
  lsqr_btol: 1.0e-6

eval:
  device: cpu
  n_eval_samples: 10000
  n_viz_samples: 32
  rotation_deg_max: 20
  rotation_deg_step: 2

lambda_sweep: [0.0, 0.0001, 0.001, 0.01, 0.05, 0.1, 0.5, 1.0, 10.0, 100.0]
